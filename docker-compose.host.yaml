services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smartlist.rule=Host(`smartlist.vannaarden.dev`)"
      - "traefik.http.routers.smartlist.entrypoints=websecure"
      - "traefik.http.routers.smartlist.tls.certresolver=letsencrypt"
      - "traefik.http.services.smartlist.loadbalancer.server.port=80"
    networks:
      - frontend

networks:
  frontend:
    external: true
