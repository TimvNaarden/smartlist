# Compressie voor tekstbestanden, vooral voor recipes.json en cocktails.json.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json image/svg+xml
</IfModule>

<IfModule mod_headers.c>
    # De json-databases veranderen zelden, de rest houden we kort vers.
    <FilesMatch "\.json$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
    <FilesMatch "\.(css|js|svg|png|jpg|jpeg)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
