# Compressie voor tekstbestanden, vooral voor recipes.json en cocktails.json.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json image/svg+xml
</IfModule>

<IfModule mod_headers.c>
    # De json-databases veranderen bij elke deploy. Met no-cache vraagt de browser
    # elke keer of het bestand nog hetzelfde is; is dat zo, dan stuurt Apache een
    # 304 en gaat er geen data over de lijn. Met een lange max-age keek je na een
    # deploy een dag lang naar oude recepten.
    # Voor de bestanden die bij een deploy veranderen: no-cache betekent niet
    # "niet bewaren" maar "elke keer navragen". Apache antwoordt met 304 zolang
    # het bestand hetzelfde is, dus er gaat geen data over de lijn. Met een lange
    # max-age keek je na een deploy naar oude recepten of oude code.
    <FilesMatch "\.(json|js|css|html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    # Afbeeldingen krijgen een nieuwe naam als ze veranderen, die mogen lang blijven.
    <FilesMatch "\.(svg|png|jpg|jpeg|webp|ico)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
